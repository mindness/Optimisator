<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ledger night desk theme: minimal money flow icon -->
  <rect width="32" height="32" fill="#0B0F17"/>
  <g stroke="#06B6D4" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Flow stream: three connected nodes representing cash flow -->
    <circle cx="8" cy="16" r="2.5"/>
    <circle cx="16" cy="16" r="2.5"/>
    <circle cx="24" cy="16" r="2.5"/>
    <!-- Connecting arrows -->
    <path d="M 10.5 16 L 13.5 16"/>
    <path d="M 18.5 16 L 21.5 16"/>
  </g>
</svg>