# API des liens courts — Hono + D1. Déploiement : voir README « Déployer ».
# Run locally:
#   cd backend
#   npm run db:migrate:local
#   npm run dev
# API listens on http://127.0.0.1:8787

name = "simulateur-flux-api"
main = "src/index.ts"
compatibility_date = "2026-09-07"

[[d1_databases]]
binding = "DB"
database_name = "simulateur-flux"
# Placeholder UUID for local Miniflare D1; replace after `wrangler d1 create`.
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

[vars]
# Origines autorisées en production (CORS), séparées par des virgules. Vide = toutes.
ALLOWED_ORIGINS = ""

# Route de production (à adapter) : le Worker répond sur /api/* du même domaine que la SPA,
# ce qui évite CORS et laisse VITE_API_URL vide.
# routes = [{ pattern = "simulateur.example.com/api/*", zone_name = "example.com" }]

# Quota d'écriture sur POST /api/scenarios, par IP appelante. Sans ce binding
# (wrangler dev, tests), l'endpoint n'a aucune limite : ne pas le retirer en prod.
# `period` ne peut valoir que 10 ou 60 secondes.
[[ratelimits]]
name = "WRITE_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
